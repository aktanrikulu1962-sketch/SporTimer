<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#111111" />
<title>Spor Zamanlayıcı</title>
<style>
  :root{
    --bg:#111111; --panel:#1c1c1e; --text:#f5f5f7; --muted:#b0b0b5;
    --accent:#34c759; --danger:#ff3b30; --secondary:#2c2c2e; --border:#3a3a3c;
    --work:#34c759; --rest:#ff9f0a; --setrest:#5ac8fa; --pre:#b0b0b5;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  .app{
    width:min(680px,100vw); min-height:100vh; padding:20px 16px 28px;
    display:flex; flex-direction:column; gap:14px; justify-content:center;
  }
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:20px;
    padding:18px; box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  h1{margin:0 0 6px; font-size:28px; text-align:center;}
  .sub{color:var(--muted); text-align:center; font-size:14px;}
  .phase{text-align:center; font-size:22px; font-weight:700; margin-bottom:8px; min-height:28px;}
  .timer{text-align:center; font-size:72px; font-weight:800; letter-spacing:1px; margin:6px 0 4px; font-variant-numeric:tabular-nums;}
  .setline{text-align:center; color:var(--muted); font-size:18px;}
  .totalline{text-align:center; color:var(--muted); font-size:14px; margin-top:6px;}
  .bar{height:6px; border-radius:3px; background:var(--secondary); margin-top:12px; overflow:hidden;}
  .bar > div{height:100%; width:0; background:var(--pre);}
  body[data-phase="work"] .phase, body[data-phase="work"] .timer{color:var(--work);}
  body[data-phase="work"] .bar > div{background:var(--work);}
  body[data-phase="rest"] .phase, body[data-phase="rest"] .timer{color:var(--rest);}
  body[data-phase="rest"] .bar > div{background:var(--rest);}
  body[data-phase="setrest"] .phase, body[data-phase="setrest"] .timer{color:var(--setrest);}
  body[data-phase="setrest"] .bar > div{background:var(--setrest);}
  body[data-phase="prestart"] .bar > div{background:var(--pre);}

  button{border:none; border-radius:16px; padding:14px 12px; font-size:18px; font-weight:700; cursor:pointer; touch-action:manipulation; user-select:none; -webkit-user-select:none;}
  button:disabled{opacity:.4; cursor:default;}
  .controls{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .start{background:var(--accent); color:#08120a;}
  .start.pause{background:var(--rest); color:#1a1000;}
  .stop{background:var(--danger); color:#fff;}

  .row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0;}
  .row + .row{border-top:1px solid var(--border);}
  .row.dim{opacity:.4;}
  .row .lbl{font-size:15px; color:var(--text); flex:1;}
  .stepper{display:flex; align-items:center; gap:8px;}
  .step-btn{width:48px; height:44px; font-size:24px; padding:0; background:var(--secondary); color:var(--text); border:1px solid var(--border);}
  .step-val{min-width:86px; text-align:center; font-size:22px; font-weight:800; font-variant-numeric:tabular-nums;}
  .locked .step-btn{opacity:.35; pointer-events:none;}

  .small{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .toggle{background:var(--secondary); color:var(--text); border:1px solid var(--border); font-size:14px; padding:12px 8px;}
  .toggle.active{background:#253347; border-color:#4f78a1;}
  .footer{text-align:center; color:var(--muted); font-size:13px;}
</style>
</head>
<body data-phase="ready">
<div class="app">
  <div class="card">
    <h1>Spor Zamanlayıcı</h1>
    <div class="sub">iPhone Safari'de çalışır. İstersen sonra Ana Ekran'a ekleyebilirsin.</div>
  </div>

  <div class="card">
    <div class="phase" id="phase">Hazır</div>
    <div class="timer" id="timer">00:45</div>
    <div class="setline" id="setline"></div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="totalline" id="totalline"></div>
  </div>

  <div class="card">
    <div class="controls">
      <button class="start" id="startBtn">Başlat</button>
      <button class="stop" id="stopBtn" disabled>Durdur</button>
    </div>
  </div>

  <div class="card" id="settings"></div>

  <div class="card">
    <div class="small">
      <button class="toggle active" id="tickToggle">Tik-tak açık</button>
      <button class="toggle active" id="voiceToggle">Sesli bildirim açık</button>
      <button class="toggle active" id="screenToggle">Ekranı açık tut</button>
    </div>
  </div>

  <div class="footer">Not: iPhone'da ses için ilk başlatma kullanıcı dokunuşuyla yapılmalıdır. Sessiz modda uygulama sesleri duyulmayabilir.</div>
</div>

<script>
(() => {
  /* ---------- Ayarlar ---------- */
  const PREP_SEC = 3;       // başlamadan önce hazırlık süresi
  const COUNTDOWN_FROM = 5; // son kaç saniyede farklı bip çalsın
  const STORE_KEY = 'sporTimer.v2';

  const FIELDS = [
    {key:'work',   label:'Çalışma süresi',            unit:' sn', min:10, max:300, step:5},
    {key:'rest',   label:'Tekrarlar arası dinlenme',  unit:' sn', min:5,  max:45,  step:1},
    {key:'reps',   label:'Setteki tekrar sayısı',     unit:'',    min:1,  max:99,  step:1},
    {key:'sets',   label:'Set sayısı',                unit:'',    min:1,  max:20,  step:1},
    {key:'setRest',label:'Setler arası bekleme',      unit:' sn', min:10, max:300, step:5},
  ];
  const cfg = {work:45, rest:7, reps:13, sets:1, setRest:60, tick:true, voice:true, wake:true};

  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    FIELDS.forEach(f => {
      if (typeof saved[f.key] === 'number') cfg[f.key] = Math.min(f.max, Math.max(f.min, saved[f.key]));
    });
    ['tick','voice','wake'].forEach(k => { if (typeof saved[k] === 'boolean') cfg[k] = saved[k]; });
  } catch(e){}
  function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); } catch(e){} }

  /* ---------- Durum ---------- */
  let state = 'idle';      // idle | running | paused | done | stopped
  let schedule = [];       // {type, dur, set, rep, start}
  let totalDur = 0;
  let t0 = 0;              // başlangıç (Date.now, ms)
  let pausedAt = 0;
  let curIdx = -1;
  let lastRem = 0;
  let intervalId = null;
  let wakeLock = null;
  let audioCtx = null;
  let speechTimer = null;

  const $ = id => document.getElementById(id);
  const phaseEl = $('phase'), timerEl = $('timer'), setlineEl = $('setline'),
        totallineEl = $('totalline'), barFill = $('barFill'),
        startBtn = $('startBtn'), stopBtn = $('stopBtn'), settingsEl = $('settings');

  const fmt = sec => {
    sec = Math.max(0, Math.round(sec));
    return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
  };
  const fmtLong = sec => {
    const m = Math.floor(sec/60), s = sec%60;
    return m ? `${m} dk${s ? ' ' + s + ' sn' : ''}` : `${s} sn`;
  };

  /* ---------- Zaman çizelgesi ---------- */
  function buildSchedule(){
    const list = [{type:'prestart', dur:PREP_SEC, set:1, rep:1}];
    for (let s = 1; s <= cfg.sets; s++){
      for (let r = 1; r <= cfg.reps; r++){
        list.push({type:'work', dur:cfg.work, set:s, rep:r});
        if (r < cfg.reps) list.push({type:'rest', dur:cfg.rest, set:s, rep:r});
        else if (s < cfg.sets) list.push({type:'setrest', dur:cfg.setRest, set:s, rep:r});
        // son tekrardan sonra dinlenme yok
      }
    }
    let acc = 0;
    list.forEach(seg => { seg.start = acc; acc += seg.dur; });
    return {list, total: acc};
  }

  function plannedTotal(){ // hazırlık hariç, kullanıcıya gösterilen süre
    return cfg.sets * (cfg.reps * cfg.work + (cfg.reps - 1) * cfg.rest) + (cfg.sets - 1) * cfg.setRest;
  }

  /* ---------- Ses ---------- */
  function ensureAudio(){
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch(e){}
  }
  function tone(freq, dur, type, gainV, attack = 0.01, delay = 0){
    try {
      ensureAudio();
      const now = audioCtx.currentTime + delay;
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(gainV, now + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + dur + 0.03);
    } catch(e){}
  }
  const gong       = () => { tone(520, 0.9, 'sine', 0.09, 0.02); tone(390, 1.0, 'triangle', 0.07, 0.03, 0.04); };
  const tickSound  = () => tone(1400, 0.03, 'square', 0.03, 0.005);
  const restPulse  = () => tone(600, 0.06, 'triangle', 0.05, 0.005);
  const countBeep  = last => tone(last ? 2200 : 1760, last ? 0.28 : 0.14, 'sine', 0.16, 0.005); // son 5 sn: belirgin, yüksek ton

  function speakNow(text){
    if (!cfg.voice || !('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel(); // eski/bayat duyuruyu temizle
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'tr-TR'; u.rate = 1.0; u.pitch = 1.0;
      window.speechSynthesis.speak(u);
    } catch(e){}
  }
  // Gong önce çalar, konuşma gongun üstüne binmesin diye kısa süre sonra başlar.
  function announce(text, withGong = true){
    clearTimeout(speechTimer);
    if (withGong) gong();
    if (text) speechTimer = setTimeout(() => speakNow(text), withGong ? 650 : 0);
  }
  function cancelSpeech(){
    clearTimeout(speechTimer);
    try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch(e){}
  }

  /* ---------- Ekran kilidi ---------- */
  async function requestWakeLock(){
    if (!cfg.wake) return;
    try { if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } } catch(e){}
  }
  async function releaseWakeLock(){
    try { if (wakeLock) { await wakeLock.release(); } } catch(e){}
    wakeLock = null;
  }

  /* ---------- Ekran ---------- */
  const LABELS = {ready:'Hazır', prestart:'Hazırlan', work:'Çalış', rest:'Dinlen', setrest:'Set arası bekleme', done:'Tamamlandı', stopped:'Durduruldu'};

  function setPhase(p){
    phaseEl.textContent = LABELS[p] || '';
    document.body.dataset.phase = p;
  }

  function renderIdle(phaseName){
    setPhase(phaseName);
    timerEl.textContent = fmt(cfg.work);
    setlineEl.textContent = `Set 1 / ${cfg.sets} · Tekrar 1 / ${cfg.reps}`;
    totallineEl.textContent = `Toplam süre: ${fmtLong(plannedTotal())}`;
    barFill.style.width = '0%';
  }

  function renderRun(seg, rem, frac, overallRemaining){
    setPhase(seg.type);
    timerEl.textContent = fmt(rem);
    setlineEl.textContent = seg.type === 'prestart'
      ? `Set 1 / ${cfg.sets} · Tekrar 1 / ${cfg.reps}`
      : seg.type === 'setrest'
        ? `Sıradaki: Set ${seg.set + 1} / ${cfg.sets}`
        : `Set ${seg.set} / ${cfg.sets} · Tekrar ${seg.rep} / ${cfg.reps}`;
    totallineEl.textContent = `Kalan toplam: ${fmt(overallRemaining)}`;
    barFill.style.width = (frac * 100).toFixed(1) + '%';
  }

  function updateButtons(){
    startBtn.textContent = state === 'running' ? 'Duraklat' : state === 'paused' ? 'Devam' : 'Başlat';
    startBtn.classList.toggle('pause', state === 'running');
    stopBtn.disabled = (state === 'idle' || state === 'done' || state === 'stopped');
    const locked = (state === 'running' || state === 'paused');
    settingsEl.classList.toggle('locked', locked);
  }

  function renderSettings(){
    settingsEl.innerHTML = '';
    FIELDS.forEach(f => {
      const row = document.createElement('div');
      row.className = 'row';
      row.dataset.key = f.key;
      row.innerHTML = `<div class="lbl">${f.label}</div>
        <div class="stepper">
          <button class="step-btn" data-dir="-1" aria-label="${f.label} azalt">−</button>
          <div class="step-val"></div>
          <button class="step-btn" data-dir="1" aria-label="${f.label} artır">+</button>
        </div>`;
      settingsEl.appendChild(row);
    });
    refreshSettings();
  }
  function refreshSettings(){
    FIELDS.forEach(f => {
      const row = settingsEl.querySelector(`[data-key="${f.key}"]`);
      row.querySelector('.step-val').textContent = cfg[f.key] + f.unit;
    });
    settingsEl.querySelector('[data-key="setRest"]').classList.toggle('dim', cfg.sets < 2);
  }

  function change(key, dir){
    if (state === 'running' || state === 'paused') return;
    const f = FIELDS.find(x => x.key === key);
    cfg[key] = Math.min(f.max, Math.max(f.min, cfg[key] + dir * f.step));
    save();
    refreshSettings();
    if (state === 'done' || state === 'stopped') state = 'idle';
    renderIdle('ready');
    updateButtons();
  }

  // + / − tuşları: dokun = tek adım, basılı tut = hızlı tekrar
  let holdTimeout = null, holdInterval = null;
  function stopHold(){ clearTimeout(holdTimeout); clearInterval(holdInterval); holdTimeout = holdInterval = null; }
  settingsEl.addEventListener('pointerdown', e => {
    const btn = e.target.closest('.step-btn');
    if (!btn) return;
    e.preventDefault();
    const key = btn.closest('.row').dataset.key, dir = Number(btn.dataset.dir);
    change(key, dir);
    stopHold();
    holdTimeout = setTimeout(() => { holdInterval = setInterval(() => change(key, dir), 110); }, 450);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => settingsEl.addEventListener(ev, stopHold));
  settingsEl.addEventListener('contextmenu', e => e.preventDefault());

  /* ---------- Ana döngü (zamanı saat belirler, sayaç sayısı değil) ---------- */
  function tick(){
    if (state !== 'running') return;
    const elapsed = (Date.now() - t0) / 1000;

    if (elapsed >= totalDur){ finish(); return; }

    // Hangi bölümdeyiz? (arka planda kaldıysa atlanan bölümler otomatik geçilir)
    let idx = curIdx < 0 ? 0 : curIdx;
    while (idx < schedule.length - 1 && elapsed >= schedule[idx].start + schedule[idx].dur) idx++;
    const seg = schedule[idx];
    const segEnd = seg.start + seg.dur;
    const rem = Math.max(1, Math.ceil(segEnd - elapsed));

    if (idx !== curIdx){
      curIdx = idx;
      lastRem = rem;
      enterSegment(seg);
    } else if (rem < lastRem){
      if (lastRem - rem === 1) beepFor(seg, rem);
      lastRem = rem;
    }

    renderRun(seg, rem, (elapsed - seg.start) / seg.dur, Math.ceil(totalDur - elapsed));
  }

  function enterSegment(seg){
    if (seg.type === 'prestart') announce('Hazırlan', false);
    else if (seg.type === 'work') announce(seg.rep === 1 && seg.set > 1 ? `Set ${seg.set}. Başla` : 'Başla');
    else if (seg.type === 'rest') announce('Dinlen');
    else if (seg.type === 'setrest') announce('Set arası dinlenme');
  }

  function beepFor(seg, rem){
    if (rem <= COUNTDOWN_FROM){ countBeep(rem === 1); return; }
    if (seg.dur - rem < 2) return;  // bölüm girişinde gong/ses varken tik çalma
    if (!cfg.tick) return;
    if (seg.type === 'work') tickSound();
    else restPulse();
  }

  function finish(){
    clearInterval(intervalId); intervalId = null;
    state = 'done';
    curIdx = -1;
    setPhase('done');
    timerEl.textContent = '00:00';
    setlineEl.textContent = `${cfg.sets} set × ${cfg.reps} tekrar`;
    totallineEl.textContent = `Toplam süre: ${fmtLong(plannedTotal())}`;
    barFill.style.width = '100%';
    announce('Antrenman tamamlandı');
    releaseWakeLock();
    updateButtons();
  }

  /* ---------- Kontroller ---------- */
  function start(){
    ensureAudio();
    // iOS'ta konuşmayı ilk dokunuşta "uyandır"
    try { if ('speechSynthesis' in window) { const u = new SpeechSynthesisUtterance(''); u.volume = 0; window.speechSynthesis.speak(u); } } catch(e){}
    requestWakeLock();
    const built = buildSchedule();
    schedule = built.list; totalDur = built.total;
    curIdx = -1; lastRem = 0;
    t0 = Date.now();
    state = 'running';
    clearInterval(intervalId);
    intervalId = setInterval(tick, 100);
    updateButtons();
    tick();
  }

  function pause(){
    if (state !== 'running') return;
    pausedAt = Date.now();
    state = 'paused';
    cancelSpeech();
    timerEl.style.opacity = '.55';
    updateButtons();
  }
  function resume(){
    if (state !== 'paused') return;
    t0 += Date.now() - pausedAt;  // duraklatma süresini zaman çizelgesinden düş
    state = 'running';
    timerEl.style.opacity = '';
    ensureAudio();
    requestWakeLock();
    updateButtons();
    tick();
  }

  function stop(){
    if (state !== 'running' && state !== 'paused') return;
    clearInterval(intervalId); intervalId = null;
    state = 'stopped';
    curIdx = -1;
    timerEl.style.opacity = '';
    cancelSpeech();
    renderIdle('stopped');
    releaseWakeLock();
    updateButtons();
    speakNow('Durduruldu');
  }

  startBtn.addEventListener('click', () => {
    if (state === 'running') pause();
    else if (state === 'paused') resume();
    else start();
  });
  stopBtn.addEventListener('click', stop);

  /* ---------- Açma/kapama düğmeleri ---------- */
  const tickToggle = $('tickToggle'), voiceToggle = $('voiceToggle'), screenToggle = $('screenToggle');
  function refreshToggles(){
    tickToggle.classList.toggle('active', cfg.tick);
    tickToggle.textContent = cfg.tick ? 'Tik-tak açık' : 'Tik-tak kapalı';
    voiceToggle.classList.toggle('active', cfg.voice);
    voiceToggle.textContent = cfg.voice ? 'Sesli bildirim açık' : 'Sesli bildirim kapalı';
    screenToggle.classList.toggle('active', cfg.wake);
    screenToggle.textContent = cfg.wake ? 'Ekranı açık tut' : 'Ekran kilitlenebilir';
  }
  tickToggle.addEventListener('click', () => { cfg.tick = !cfg.tick; save(); refreshToggles(); });
  voiceToggle.addEventListener('click', () => { cfg.voice = !cfg.voice; if (!cfg.voice) cancelSpeech(); save(); refreshToggles(); });
  screenToggle.addEventListener('click', async () => {
    cfg.wake = !cfg.wake; save(); refreshToggles();
    if (!cfg.wake) await releaseWakeLock();
    else if (state === 'running') await requestWakeLock();
  });

  // Sekmeye dönünce ekran kilidini yenile ve zamanı hemen yakala
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state === 'running'){
      requestWakeLock();
      tick();
    }
  });

  /* ---------- Başlangıç ---------- */
  renderSettings();
  refreshToggles();
  renderIdle('ready');
  updateButtons();
})();
</script>
</body>
</html>
